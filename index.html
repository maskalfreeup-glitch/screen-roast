<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Screen Roast: The AI Screen-Time & Brain-Rot Mirror. Brutally honest 9:16 Story Cards of your digital squalor." />
    <title>Screen Roast // The AI Screen-Time & Brain-Rot Mirror</title>

    <!-- Google Fonts for Brutalist & Terminal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💀</text></svg>" />
  </head>
  <body class="bg-grid">
    <!-- Subtle CRT Scanlines -->
    <div class="scanline-overlay"></div>

    <!-- Header Bar -->
    <header class="w-full max-w-xl mx-auto px-4 py-3 flex items-center justify-between border-b border-slate-800/80 font-mono text-xs select-none">
      <div class="flex items-center gap-2">
        <span class="text-base">💀</span>
        <span class="font-black tracking-wider text-emerald-400">SCREEN ROAST</span>
        <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-1.5 py-0.2 rounded">v1.0-MVP</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="audio-toggle-btn" class="text-emerald-400 font-bold hover:underline active:scale-95 transition-all text-[11px] bg-slate-900 px-2.5 py-1 rounded border border-slate-800">
          🔊 SOUND ON
        </button>
      </div>
    </header>

    <!-- Root Application Container -->
    <main id="app" class="relative z-10"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
